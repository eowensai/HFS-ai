name: ephemerai-review
services:
  ollama:
    image: ollama/ollama:0.32.15@sha256:57d60e686821ea81a7748a3ec8141308c8b8f95b27105713954abf7a6529e700
    mem_limit: 18g
    memswap_limit: 18g
    ulimits:
      core:
        soft: 0
        hard: 0
    restart: unless-stopped
    networks:
    - llm-net
    volumes:
    - ./.local/ollama:/root/.ollama
    - ./.local/privacy/libephemerai_nodump.so:/opt/ephemerai/libephemerai_nodump.so:ro
    tmpfs:
    - /tmp:rw,nosuid,nodev,size=1g,mode=1777
    - /var/tmp:rw,nosuid,nodev,size=256m,mode=1777
    environment:
    - LD_PRELOAD=/opt/ephemerai/libephemerai_nodump.so
    - NVIDIA_VISIBLE_DEVICES=all
    - OLLAMA_HOST=0.0.0.0:11434
    - OLLAMA_ORIGINS=${OLLAMA_ORIGINS:-}
    - OLLAMA_NO_CLOUD=1
    - OLLAMA_MAX_LOADED_MODELS=1
    - OLLAMA_NUM_PARALLEL=1
    - OLLAMA_MAX_QUEUE=${OLLAMA_MAX_QUEUE:-16}
    - OLLAMA_FORCE_CUBLAS_LT=1
    - OLLAMA_KEEP_ALIVE=-1
    - OLLAMA_FLASH_ATTENTION=1
    - OLLAMA_KV_CACHE_TYPE=q8_0
    expose:
    - '11434'
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
    logging:
      driver: none
    labels:
      ephemerai.inference: ollama
  tika-server:
    image: ${EPHEMERAI_TIKA_IMAGE:-ephemerai-review:tika4}
    mem_limit: 6g
    memswap_limit: 6g
    ulimits:
      core:
        soft: 0
        hard: 0
    restart: unless-stopped
    networks:
    - llm-net
    environment:
    - LD_PRELOAD=/opt/ephemerai/libephemerai_nodump.so
    - JAVA_TOOL_OPTIONS=-Xmx512m -Xms128m -Djava.io.tmpdir=/tmp -Duser.home=/tmp -XX:-CreateCoredumpOnCrash
      -XX:-HeapDumpOnOutOfMemoryError -XX:ErrorFile=/tmp/hs_err_pid%p.log
    expose:
    - '9998'
    tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=1g,mode=1777
    - /var/tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777
    volumes:
    - ./.local/privacy/libephemerai_nodump.so:/opt/ephemerai/libephemerai_nodump.so:ro
    logging:
      driver: none
    build: ./deployment/tika
  ephemeral-app:
    image: ${EPHEMERAI_APP_IMAGE:-ephemerai-review:app}
    mem_limit: 2g
    memswap_limit: 2g
    ulimits:
      core:
        soft: 0
        hard: 0
    restart: unless-stopped
    networks:
    - llm-net
    ports:
    - ${EPHEMERAI_BIND_ADDRESS:-127.0.0.1}:${EPHEMERAI_PORT:-8501}:8501
    environment:
      LD_PRELOAD: /opt/ephemerai/libephemerai_nodump.so
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL_NAME: hfs-ephemeral-shared-qwen3.8-27b-ud-q6km-131072
      LLM_CONTEXT_TOKENS: '131072'
      LLM_OUTPUT_RESERVE_TOKENS: '32768'
      LLM_REQUEST_TIMEOUT_S: '1800'
      LLM_MAX_RETRIES: '0'
      LLM_REASONING_EFFORT: medium
      LLM_THINKING_EFFORT: xhigh
      LLM_SHOW_REASONING: 'false'
      LLM_TEMPERATURE: '1.0'
      LLM_TOP_P: '0.95'
      LLM_PRESENCE_PENALTY: '0.0'
      LLM_MAX_TOKENS: '32768'
      TIKA_URL: http://tika-server:9998
      STREAMLIT_SERVER_HEADLESS: 'true'
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      LLM_BACKEND: ollama
    depends_on:
      ollama:
        condition: service_started
      tika-server:
        condition: service_started
    tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=1g,mode=1777
    - /var/tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777
    logging:
      driver: local
      options:
        max-size: 2m
        max-file: '3'
    runtime: runc
    init: true
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8501/_stcore/health",
        timeout=5)
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    build: .
networks:
  llm-net:
    driver: bridge
