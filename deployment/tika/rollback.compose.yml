# Apply only with the main Compose file; recreate this pair without building.
services:
  ephemeral-app:
    image: ${EPHEMERAL_ROLLBACK_IMAGE:?Set the retained pre-upgrade application digest}
    pull_policy: never
  tika-server:
    image: ${TIKA_ROLLBACK_IMAGE:?Set the matching retained pre-upgrade Tika digest}
    pull_policy: never
    environment:
      # Restore the previous 3.3.2 JVM profile; container/tmpfs/no-dump limits stay.
      - JAVA_TOOL_OPTIONS=-Xmx2g -Xms512m -Djava.io.tmpdir=/tmp -Duser.home=/tmp -XX:-CreateCoredumpOnCrash -XX:-HeapDumpOnOutOfMemoryError -XX:ErrorFile=/tmp/hs_err_pid%p.log
