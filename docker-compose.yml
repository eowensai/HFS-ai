###############################################################################
# docker-compose.yml — EphemerAl demo stack
#
# Three-service layout:
#   • ollama        — serves the LLM (GPU / CUDA)
#   • tika-server   — parses over 100 document types
#   • ephemeral-app — Streamlit front-end website
#
# The Qwen3.8 alias and inference profile are fixed for this stack.
# CUSTOMIZE only service / container names when different labels are required.
###############################################################################

# Keep existing volume/network identities independent of the checkout folder.
name: ephemeral-llm

services:
  # --------------------------------------------------------------------------
  # Large-language-model back-end (Ollama)
  # --------------------------------------------------------------------------
  ollama:
    # Pinned for the shared Unsloth Qwen3.8-27B alias. Last validated: August 2026.
    # Check https://github.com/ollama/ollama/releases before upgrading.
    # NOTE: ollama/ollama#14716 (vision+thinking) is fixed; workaround retained as defense-in-depth.
    image: ollama/ollama:0.32.15
    container_name: ollama
    # Equal memory and memory+swap limits prohibit Linux container swapping.
    mem_limit: 18g
    memswap_limit: 18g
    ulimits:
      core:
        soft: 0
        hard: 0
    restart: unless-stopped
    networks: [llm-net]

    # Model weights live here; bind to a fast disk if possible
    volumes:
      - ollama-models:/root/.ollama
      - ./deployment/privacy/libephemerai_nodump.so:/opt/ephemerai/libephemerai_nodump.so:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g,mode=1777
      - /var/tmp:rw,nosuid,nodev,size=256m,mode=1777

    environment:
      - LD_PRELOAD=/opt/ephemerai/libephemerai_nodump.so
      # NVIDIA_VISIBLE_DEVICES=all lets the container see every GPU the host has.
      - NVIDIA_VISIBLE_DEVICES=all
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=${OLLAMA_ORIGINS:-}
      - OLLAMA_NO_CLOUD=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_QUEUE=${OLLAMA_MAX_QUEUE:-16}
      # Helpful CUDA GEMM path for supported GPU workloads.
      - OLLAMA_FORCE_CUBLAS_LT=1
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0          # Q8 KV cache precision (KV memory only, not model-weight quantization); requires FLASH_ATTENTION=1 above.

    # Intentionally internal-only on llm-net for privacy; temporarily switch to
    # ports: ["11434:11434"] for local host debugging with curl if needed.
    expose: ["11434"]

    # GPU reservation for Docker Compose v3+
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # "count: all" automatically uses all available GPUs detected by Docker.
              count: all
              capabilities: [gpu]

    # Disable Docker logs for this container (privacy)
    logging:
      driver: "none"

  # --------------------------------------------------------------------------
  # Apache Tika — document parsing
  # --------------------------------------------------------------------------
  tika-server:
    # Locally built and digest-pinned. Fresh installs set TIKA_IMAGE in .env;
    # the fallback preserves the current host. See deployment/tika/README.md.
    image: ${TIKA_IMAGE:-shared-tika:3.3.2-20260907@sha256:784a7f31e10139492bc22ccdbfbabc727a888ea3d851a1293723369333f8e09c}
    pull_policy: never
    container_name: tika-server
    # Equal memory and memory+swap limits prohibit Linux container swapping.
    mem_limit: 6g
    memswap_limit: 6g
    ulimits:
      core:
        soft: 0
        hard: 0
    restart: unless-stopped
    networks: [llm-net]
    environment:
      - LD_PRELOAD=/opt/ephemerai/libephemerai_nodump.so
      - JAVA_TOOL_OPTIONS=-Xmx2g -Xms512m -XX:-CreateCoredumpOnCrash -XX:-HeapDumpOnOutOfMemoryError -XX:ErrorFile=/tmp/hs_err_pid%p.log
    # Internal-only on llm-net. Probe the private IP; never publish this port.
    expose: ["9998"]

    # Keep /tmp in RAM so uploaded docs never touch disk inside the container
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=1g,mode=1777
      - /var/tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777

    volumes:
      - ./deployment/privacy/libephemerai_nodump.so:/opt/ephemerai/libephemerai_nodump.so:ro

    # Disable Docker logs for this container (privacy)
    logging:
      driver: "none"

  # --------------------------------------------------------------------------
  # Streamlit front-end (EphemerAl)
  # --------------------------------------------------------------------------
  ephemeral-app:
    image: ephemeral-llm-ephemeral-app:latest
    build: .                              # uses local Dockerfile
    container_name: ephemeral-app
    # Equal memory and memory+swap limits prohibit Linux container swapping.
    mem_limit: 2g
    memswap_limit: 2g
    ulimits:
      core:
        soft: 0
        hard: 0
    restart: unless-stopped
    networks: [llm-net]

    ports: ["0.0.0.0:8501:8501"]

    environment:
      - LD_PRELOAD=/opt/ephemerai/libephemerai_nodump.so
      - LLM_BASE_URL=http://ollama:11434/v1
      - LLM_MODEL_NAME=hfs-ephemeral-shared-qwen3.8-27b-ud-q6km-131072
      - LLM_CONTEXT_TOKENS=131072          # App-side budgeting hint; matches the forced-full-offload Q6 alias.
      - LLM_OUTPUT_RESERVE_TOKENS=32768
      - LLM_REQUEST_TIMEOUT_S=1800
      - LLM_MAX_RETRIES=0
      - LLM_REASONING_EFFORT=medium
      # OpenAI-compatible Qwen request setting. Native Ollama uses think=max;
      # this client sends reasoning_effort=xhigh.
      - LLM_THINKING_EFFORT=xhigh
      - LLM_SHOW_REASONING=false
      - LLM_TEMPERATURE=1.0
      - LLM_TOP_P=0.95
      - LLM_PRESENCE_PENALTY=0.0
      - LLM_MAX_TOKENS=32768
      - TIKA_URL=http://tika-server:9998
      - TIKA_CLIENT_ONLY=true
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      # - EPHEMERAL_TIMEZONE=America/New_York   # CUSTOMIZE: Override system timezone (optional)

    depends_on: [ollama, tika-server]

    # Static assets (logo, CSS) mounted read-only
    volumes:
      - ./static:/app/static:ro
      - ./deployment/privacy/libephemerai_nodump.so:/opt/ephemerai/libephemerai_nodump.so:ro

    # Keep /tmp in RAM for any temporary upload buffers
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=1g,mode=1777
      - /var/tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777

    # Rotated logs for debugging.
    # For a final kiosk box, you can change driver: "local" → "none".
    logging:
      driver: "local"
      options:
        max-size: "2m"
        max-file: "3"

# --------------------------------------------------------------------------
# Shared network — keeps container DNS simple (ollama, tika-server, etc.)
# --------------------------------------------------------------------------
networks:
  llm-net:
    driver: bridge

# --------------------------------------------------------------------------
# Named volume for Ollama models (survives container rebuilds)
# --------------------------------------------------------------------------
volumes:
  ollama-models: {}
