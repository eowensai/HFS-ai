version: '3.8'

services:
  kiosk-app:
    build: .
    container_name: kiosk-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    networks:
      - llm-net
    environment:
      - LLM_MODEL_NAME=g27:latest
      - LLM_BASE_URL=http://192.168.87.64:11434/v1
      - TIKA_URL=http://tika-server:9998
      - TIKA_CLIENT_ONLY=true

networks:
  default:              # ← this key overrides the implicit default
    external: true
    name: llm-net       # point it at your pre-made bridge

  llm-net:              # keep this so the 'external' reference resolves
    external: true
